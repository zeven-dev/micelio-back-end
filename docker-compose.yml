services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: micelio
      POSTGRES_PASSWORD: micelio
      POSTGRES_DB: micelio
    ports:
      - '5432:5432'
    volumes:
      - micelio_postgres_data:/var/lib/postgresql/data

  # S3-compatible object storage for local development.
  # In production, point AWS_* env vars at a real S3 bucket instead of this service.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: micelio
      MINIO_ROOT_PASSWORD: micelio12345
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    volumes:
      - micelio_minio_data:/data

  # Creates the default bucket on startup so the API can use it immediately.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 micelio micelio12345; do sleep 1; done;
      mc mb -p local/micelio-files;
      mc anonymous set download local/micelio-files;
      exit 0;
      "

volumes:
  micelio_postgres_data:
  micelio_minio_data:
